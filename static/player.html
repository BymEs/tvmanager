<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>TV Manager Player</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#fff;font-family:system-ui,sans-serif}#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}#stage img,#stage video,#stage iframe{width:100%;height:100%;object-fit:contain;border:0}.status{position:fixed;top:14px;right:14px;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.65);font-size:13px;z-index:10}.hidden{display:none!important}.message{text-align:center;padding:32px}.message h1{font-size:42px;margin:0 0 12px}.message p{opacity:.7}
  </style>
</head>
<body>
<div id="stage"><div class="message"><h1>TV Manager</h1><p>Sunucu bağlantısı hazırlanıyor…</p></div></div>
<div id="status" class="status">Bağlanıyor</div>
<script>
const params=new URLSearchParams(location.search);
const deviceId=params.get('device_id')||localStorage.getItem('tvmanager_device_id')||('tv-'+Math.random().toString(36).slice(2,10));
localStorage.setItem('tvmanager_device_id',deviceId);
const stage=document.getElementById('stage');
const statusEl=document.getElementById('status');
let socket=null,playlist=null,index=0,timer=null,reconnectTimer=null;
function setStatus(text){statusEl.textContent=deviceId+' · '+text}
function clearStage(){clearTimeout(timer);timer=null;stage.innerHTML=''}
function sendStatus(extra={}){if(socket&&socket.readyState===WebSocket.OPEN){socket.send(JSON.stringify({type:'status',device_id:deviceId,href:location.href,user_agent:navigator.userAgent,...extra}))}}
function showMessage(title,text){clearStage();stage.innerHTML=`<div class="message"><h1>${title}</h1><p>${text}</p></div>`}
function playItem(){if(!playlist||!playlist.items||!playlist.items.length){showMessage('TV Manager','Playlist boş.');return}clearStage();const item=playlist.items[index%playlist.items.length];let el;if(item.type==='image'){el=document.createElement('img');el.src=item.url}else if(item.type==='video'||item.type==='stream'){el=document.createElement('video');el.src=item.url;el.autoplay=true;el.muted=true;el.playsInline=true;el.controls=false;el.onerror=next}else if(item.type==='web'){el=document.createElement('iframe');el.src=item.url;el.allow='autoplay; fullscreen'}else{showMessage('Desteklenmeyen içerik',item.type);return}stage.appendChild(el);sendStatus({state:'playing',playlist_id:playlist.id,item_index:index,item_type:item.type});const duration=Math.max(1,Number(item.duration||10));timer=setTimeout(next,duration*1000)}
function next(){if(!playlist)return;index=(index+1)%playlist.items.length;playItem()}
function applyCommand(message){switch(message.command){case'reload':location.reload();break;case'play':if(stage.querySelector('video'))stage.querySelector('video').play();break;case'pause':if(stage.querySelector('video'))stage.querySelector('video').pause();clearTimeout(timer);break;case'stop':playlist=null;showMessage('Durduruldu','Yönetim panelinden yeni yayın bekleniyor.');sendStatus({state:'stopped'});break;case'blackout':playlist=null;clearStage();stage.style.background='#000';sendStatus({state:'blackout'});break}}
function connect(){clearTimeout(reconnectTimer);const proto=location.protocol==='https:'?'wss':'ws';socket=new WebSocket(`${proto}://${location.host}/ws/player/${encodeURIComponent(deviceId)}`);socket.onopen=()=>{setStatus('Çevrimiçi');sendStatus({state:playlist?'playing':'idle'})};socket.onmessage=event=>{let msg;try{msg=JSON.parse(event.data)}catch{return}if(msg.type==='playlist'){playlist=msg.playlist;index=0;playItem()}else if(msg.type==='command'){applyCommand(msg)}else if(msg.type==='welcome'){setStatus('Hazır')}};socket.onclose=()=>{setStatus('Bağlantı kesildi');reconnectTimer=setTimeout(connect,3000)};socket.onerror=()=>socket.close()}
document.addEventListener('visibilitychange',()=>sendStatus({visibility:document.visibilityState}));window.addEventListener('online',connect);connect();
</script>
</body>
</html>
